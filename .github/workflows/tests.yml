name: Reproducibility checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            requirements: requirements.txt
            torch: "2.8.0"
            torchvision: "0.23.0"
          - python-version: "3.12"
            requirements: requirements.txt
            torch: "2.8.0"
            torchvision: "0.23.0"
          - python-version: "3.12"
            requirements: requirements-paper.txt
            torch: "2.10.0"
            torchvision: "0.25.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-paper.txt
      - name: Install the pinned CPU framework
        run: python -m pip install torch==${{ matrix.torch }} torchvision==${{ matrix.torchvision }} --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package and reference metric tests
        run: python -m pip install -r ${{ matrix.requirements }} -e '.[test]'
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests without downloading datasets or weights
        run: python -m unittest discover -s tests -v
