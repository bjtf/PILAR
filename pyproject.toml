[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pilar-anomaly-detection"
version = "0.1.0"
description = "Pyramidal inhibitory reconstruction for visual anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Bruno J. T. Fernandes"}]
dependencies = [
  "torch>=2.8.0,<2.11",
  "torchvision>=0.23.0,<0.26",
  "numpy>=2.0.2,<2.5",
  "scipy>=1.13.1,<1.18",
  "Pillow>=11.3.0,<13",
  "matplotlib>=3.9.4,<4",
  "pandas>=2.3.3,<3",
]

[project.optional-dependencies]
test = ["scikit-learn==1.6.1"]

[tool.setuptools.packages.find]
include = ["lipnet*", "scripts*"]
