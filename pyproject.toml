[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pilar-anomaly-detection"
version = "0.1.0"
description = "Pyramidal inhibitory reconstruction for visual anomaly detection"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Bruno J. T. Fernandes"}]
dependencies = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "numpy==2.0.2",
  "scipy==1.13.1",
  "Pillow==11.3.0",
  "matplotlib==3.9.4",
  "pandas==2.3.3",
]

[tool.setuptools.packages.find]
include = ["lipnet*"]
